# npm trusted publisher is bound to this filename. Do not rename without
# updating the @9thlevelsoftware org trusted-publisher config.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check publish allowlist
        run: node scripts/check-publish-allowlist.mjs

      - name: Publish
        # pnpm runs each package's prepack, which bundles skills/ into @9thlevelsoftware/legion-cli-agents.
        # --no-git-checks: the tag checkout is detached, so pnpm's branch check would refuse.
        run: pnpm publish -r --access public --provenance --no-git-checks
