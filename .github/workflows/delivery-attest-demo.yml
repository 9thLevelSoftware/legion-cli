name: Delivery Attestation Demo (temporary)

# Temporary demo driver for the assurance-integration branch. GitHub only dispatches
# workflow_dispatch from the default branch, so this workflow is driven by pushing
# .github/delivery-attest-demo/request.json:
#   { "phase": "build" }                                            -> build and upload the synthetic bundle
#   { "phase": "attest", "bundleRunId": "<id>", "predicateSha256": "<hex>" } -> attest the consented predicate

on:
  push:
    branches: [assurance-integration]
    paths:
      - .github/delivery-attest-demo/request.json

permissions: {}

jobs:
  request:
    name: Read demo request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.read.outputs.phase }}
      bundle-run-id: ${{ steps.read.outputs.bundle-run-id }}
      predicate-sha256: ${{ steps.read.outputs.predicate-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse and validate request.json
        id: read
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const request = JSON.parse(readFileSync(".github/delivery-attest-demo/request.json", "utf8"));
          const allowed = new Set(["phase", "bundleRunId", "predicateSha256"]);
          for (const key of Object.keys(request)) if (!allowed.has(key)) throw new Error(`unexpected request key ${key}`);
          const out = [];
          if (request.phase === "build") {
            if ("bundleRunId" in request || "predicateSha256" in request) throw new Error("build request takes no bundleRunId/predicateSha256");
            out.push("phase=build", "bundle-run-id=", "predicate-sha256=");
          } else if (request.phase === "attest") {
            if (typeof request.bundleRunId !== "string" || !/^[0-9]+$/.test(request.bundleRunId)) throw new Error("attest requires a numeric string bundleRunId");
            if (typeof request.predicateSha256 !== "string" || !/^[a-f0-9]{64}$/.test(request.predicateSha256)) throw new Error("attest requires a lowercase hex predicateSha256");
            out.push("phase=attest", `bundle-run-id=${request.bundleRunId}`, `predicate-sha256=${request.predicateSha256}`);
          } else {
            throw new Error(`phase must be "build" or "attest"`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `${out.join("\n")}\n`);
          NODE

  build:
    name: Build synthetic demo delivery bundle
    needs: request
    if: ${{ needs.request.outputs.phase == 'build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build native component host
        run: |
          node scripts/build-wasi-host.mjs
          git checkout -- extensions/json-contract

      - name: Build
        run: pnpm build

      - name: Installed assurance smoke with demo bundle export
        run: node scripts/assurance-smoke.mjs --demo-bundle-out "$RUNNER_TEMP/demo-bundle"

      - name: Publish predicate for review
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/demo-bundle"
          test -s "$bundle/manifest.json"
          test -s "$bundle/predicate.json"
          predicate_sha="$(sha256sum "$bundle/predicate.json" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "$bundle/manifest.json" | cut -d' ' -f1)"
          {
            echo "## Demo delivery bundle"
            echo
            echo "- predicate.json SHA-256: \`$predicate_sha\`"
            echo "- manifest.json SHA-256 (attestation subject): \`$manifest_sha\`"
            echo
            echo "### predicate.json"
            echo
            echo '```json'
            cat "$bundle/predicate.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "predicate.json SHA-256: $predicate_sha"
          echo "manifest.json SHA-256: $manifest_sha"

      - name: Upload demo delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: demo-delivery-bundle
          path: ${{ runner.temp }}/demo-bundle/
          if-no-files-found: error

  attest:
    name: Attest consented demo predicate
    needs: request
    if: ${{ needs.request.outputs.phase == 'attest' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/delivery-attest.yml
    with:
      bundle-artifact-name: demo-delivery-bundle
      bundle-run-id: ${{ needs.request.outputs.bundle-run-id }}
      predicate-sha256: ${{ needs.request.outputs.predicate-sha256 }}
      public-disclosure-consent: true
